<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요금제 계산기</title>

<style>
body{
font-family:sans-serif;
background:#f5f5f5;
padding:30px;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:25px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

.result{
margin-top:25px;
padding:20px;
background:#f0f7ff;
border-radius:15px;
}

.result h2{
margin:0;
font-size:20px;
}

.big{
font-size:32px;
font-weight:bold;
color:#2563eb;
margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>약정 계산기</h1>

<label>M 기존 실제 납부 요금</label>
<input type="number" id="m">

<label>A 1~6개월 유지 요금제</label>
<input type="number" id="a">

<label>B 7~24개월 유지 요금제</label>
<input type="number" id="b">

<label>F 할인된 기기할부 원금</label>
<input type="number" id="f">

<div class="result">
<h2>최종 결과 X</h2>

<div class="big" id="result">
0원
</div>

<p id="detail"></p>

</div>
</div>

<script>

const inputs=document.querySelectorAll("input");

inputs.forEach(input=>{
input.addEventListener("input",calculate);
});

function won(num){
return Number(num).toLocaleString("ko-KR")+"원";
}

function calculate(){

const M=Number(document.getElementById("m").value)||0;
const A=Number(document.getElementById("a").value)||0;
const B=Number(document.getElementById("b").value)||0;
const F=Number(document.getElementById("f").value)||0;

const Q=A-M;
const sixQ=Q*6;

const W=B-M;
const eighteenW=W*18;

const X=F+sixQ+eighteenW;

document.getElementById("result").innerText=won(X);

document.getElementById("detail").innerHTML=

Q = ${won(Q)}<br>
6Q = ${won(sixQ)}<br><br>

W = ${won(W)}<br>
18W = ${won(eighteenW)}<br><br>

F = ${won(F)}
;

}

</script>

</body>
